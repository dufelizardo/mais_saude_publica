apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: mais-saude-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mais-saude-app
  template:
    metadata:
      labels:
        app: mais-saude-app
    spec:
      containers:
        - name: app
          image: ghcr.io/dufelizardo/mais_saude_publica:developer
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
