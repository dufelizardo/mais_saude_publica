apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: mais-saude-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mais-saude-app
  template:
    metadata:
      labels:
        app: mais-saude-app
    spec:
      containers:
        - name: app
          image: ghcr.io/dufelizardo/mais_saude_publica:developer
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            # Opcional (ver ADR-0055) — sem este secret provisionado, a app sobe normalmente e
            # JwtService gera uma chave efemera em memoria (tokens nao sobrevivem a um restart).
            - name: APP_SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
                  optional: true
            # Bootstrap do AdministradorPlataforma (ADR-0054 decisao 5) — tambem opcional: sem os
            # dois valores, AdministradorPlataformaBootstrap so pula a criacao (nao crasha). Mas se
            # o toggle de seguranca estiver ligado (ver overlay) e nenhum Usuario existir ainda,
            # ninguem consegue logar sem isso provisionado.
            - name: APP_SECURITY_BOOTSTRAP_CPF
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: bootstrap-cpf
                  optional: true
            - name: APP_SECURITY_BOOTSTRAP_SENHA
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: bootstrap-senha
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # startupProbe segura o readiness/liveness até a app responder — sem isso, o liveness
          # (initialDelaySeconds curto) mata o container no meio da subida do Spring Boot/Hibernate,
          # principalmente no CPU modesto do home-lab (ver ADR-0012). Até 120x5s = 10 min pra primeira
          # resposta antes de considerar falha real: depois de um reinício do servidor, as APIs de todos
          # os ambientes sobem juntas sobre o mesmo disco (até 13 reinícios observados em 2026-10-01).
          # As verificações usam o health do Actuator (ADR-0145), e não o /v3/api-docs: gerar o Swagger
          # da API inteira passou a levar 86 s com meia CPU, e a verificação (1 s por padrão) matava o
          # container em ciclo (2026-10-23). O timeout de 5 s cobre um servidor ocupado.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
