apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: mais-saude-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mais-saude-app
  template:
    metadata:
      labels:
        app: mais-saude-app
    spec:
      containers:
        - name: app
          image: ghcr.io/dufelizardo/mais_saude_publica:developer
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # startupProbe segura o readiness/liveness até a app responder — sem isso, o liveness
          # (initialDelaySeconds curto) mata o container no meio da subida do Spring Boot/Hibernate
          # antes dele terminar de criar o schema, principalmente no CPU modesto do home-lab
          # (ver ADR-0012). Até 36x5s = 180s pra primeira resposta antes de considerar falha real.
          startupProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            failureThreshold: 36
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            periodSeconds: 20
