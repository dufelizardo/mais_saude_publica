apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mais-saude-qaa

resources:
  - ../../base
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-ingress.yaml

images:
  - name: ghcr.io/dufelizardo/mais_saude_publica
    newTag: 45d4220b8e48d6f549ef96ccddf79b554ac98ae9
  - name: ghcr.io/dufelizardo/mais_saude_publica-frontend
    newTag: 45d4220b8e48d6f549ef96ccddf79b554ac98ae9

configMapGenerator:
  - name: app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx384m
      - DATABASE_URL=jdbc:postgresql://postgres:5432/saudepublica_qaa
      - DATABASE_USERNAME=postgres
      # Exige login (ADR-0055); o secret app-secrets foi provisionado neste namespace.
      # A exigência de permissão segue desligada: ver docs/acesso/GUIA-LIGAR-AUTORIZACAO.md.
      - APP_SECURITY_ENABLED=true
  - name: mdns-config
    literals:
      # Nome amigável na rede local (ADR-0169).
      - MDNS_NOME=maissaudepublica-qaa.local
  - name: db-config
    literals:
      - POSTGRES_DB=saudepublica_qaa
      - POSTGRES_USER=postgres

patches:
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: qaa.mais-saude.local
