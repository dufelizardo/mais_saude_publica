apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mais-saude-qaa

resources:
  - ../../base
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-ingress.yaml

images:
  - name: ghcr.io/dufelizardo/mais_saude_publica
    newTag: 92b252a3a23fe52b33bccb6aea41a7884a9d4edc
  - name: ghcr.io/dufelizardo/mais_saude_publica-frontend
    newTag: 92b252a3a23fe52b33bccb6aea41a7884a9d4edc

configMapGenerator:
  - name: app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx384m
      - DATABASE_URL=jdbc:postgresql://postgres:5432/saudepublica_qaa
      - DATABASE_USERNAME=postgres
  - name: mdns-config
    literals:
      # Nome amigável na rede local (ADR-0169).
      - MDNS_NOME=maissaudepublica-qaa.local
  - name: db-config
    literals:
      - POSTGRES_DB=saudepublica_qaa
      - POSTGRES_USER=postgres

patches:
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: qaa.mais-saude.local
