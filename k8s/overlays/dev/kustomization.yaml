apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mais-saude-dev

resources:
  - ../../base
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-ingress.yaml

images:
  - name: ghcr.io/dufelizardo/mais_saude_publica
    newTag: 2ff591c1c2bf107cb8d70bebd42798e30f56f7fa
  - name: ghcr.io/dufelizardo/mais_saude_publica-frontend
    newTag: 2ff591c1c2bf107cb8d70bebd42798e30f56f7fa

configMapGenerator:
  - name: app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx384m
      - DATABASE_URL=jdbc:postgresql://postgres:5432/saudepublica_dev
      - DATABASE_USERNAME=postgres
  - name: db-config
    literals:
      - POSTGRES_DB=saudepublica_dev
      - POSTGRES_USER=postgres

patches:
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.mais-saude.local
