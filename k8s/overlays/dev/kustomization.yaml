apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mais-saude-dev

resources:
  - ../../base
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-ingress.yaml

images:
  - name: ghcr.io/dufelizardo/mais_saude_publica
    newTag: f0fd0eb3c69f4cdff712a4c0bae302baa18921fe
  - name: ghcr.io/dufelizardo/mais_saude_publica-frontend
    newTag: f0fd0eb3c69f4cdff712a4c0bae302baa18921fe

configMapGenerator:
  - name: app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx384m
      - DATABASE_URL=jdbc:postgresql://postgres:5432/saudepublica_dev
      - DATABASE_USERNAME=postgres
      # Ligado pela primeira vez neste ambiente (ver ADR-0055) — requer o secret app-secrets
      # (jwt-secret, bootstrap-cpf, bootstrap-senha) provisionado no namespace mais-saude-dev,
      # senao ninguem consegue logar (sem crash, so sem ninguem cadastrado).
      - APP_SECURITY_ENABLED=true
  - name: db-config
    literals:
      - POSTGRES_DB=saudepublica_dev
      - POSTGRES_USER=postgres

patches:
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.mais-saude.local
