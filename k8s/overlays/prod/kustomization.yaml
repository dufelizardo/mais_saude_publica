apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mais-saude-prod

resources:
  - ../../base
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-ingress.yaml

images:
  - name: ghcr.io/dufelizardo/mais_saude_publica
    newTag: 5789a2f1a440589676f7c5b2e779f40972b11474
  - name: ghcr.io/dufelizardo/mais_saude_publica-frontend
    newTag: 5789a2f1a440589676f7c5b2e779f40972b11474

configMapGenerator:
  - name: app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx384m
      - DATABASE_URL=jdbc:postgresql://postgres:5432/saudepublica
      - DATABASE_USERNAME=postgres
  - name: db-config
    literals:
      - POSTGRES_DB=saudepublica
      - POSTGRES_USER=postgres

patches:
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: mais-saude.local
