apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mais-saude-prod

resources:
  - ../../base
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-ingress.yaml
  # Alta disponibilidade e aviso de queda (ADR-0209).
  - alta-disponibilidade.yaml
  - vigia.yaml

images:
  - name: ghcr.io/dufelizardo/mais_saude_publica
    newTag: 4ae70a05025aee113ccd31f4539724a3860e2389
  - name: ghcr.io/dufelizardo/mais_saude_publica-frontend
    newTag: 4ae70a05025aee113ccd31f4539724a3860e2389

configMapGenerator:
  - name: app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=58 -XX:+ExitOnOutOfMemoryError
      - DATABASE_URL=jdbc:postgresql://postgres:5432/saudepublica
      - DATABASE_USERNAME=postgres
      # Exige login (ADR-0055); o secret app-secrets foi provisionado neste namespace.
      # A exigência de permissão segue desligada: ver docs/acesso/GUIA-LIGAR-AUTORIZACAO.md.
      - APP_SECURITY_ENABLED=true
  - name: vigia
    files:
      - vigia/vigia.py
  - name: mdns-config
    literals:
      # Nome amigável na rede local (ADR-0169).
      - MDNS_NOME=maissaudepublica.local
  - name: db-config
    literals:
      - POSTGRES_DB=saudepublica
      - POSTGRES_USER=postgres

patches:
  # A quantidade de réplicas da API é do autoscaler (alta-disponibilidade.yaml), não do manifest; e produção tem prioridade.
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: remove
        path: /spec/replicas
      - op: add
        path: /spec/template/spec/priorityClassName
        value: mais-saude-producao
  - target:
      kind: Deployment
      name: postgres
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: mais-saude-producao
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/priorityClassName
        value: mais-saude-producao
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: mais-saude.local
