apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mais-saude-homolog

resources:
  - ../../base
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-ingress.yaml

images:
  - name: ghcr.io/dufelizardo/mais_saude_publica
    newTag: 362c5384f3ad65cf0b04a45456b0f41c782f6d46
  - name: ghcr.io/dufelizardo/mais_saude_publica-frontend
    newTag: 362c5384f3ad65cf0b04a45456b0f41c782f6d46

configMapGenerator:
  - name: app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx384m
      - DATABASE_URL=jdbc:postgresql://postgres:5432/saudepublica_homologacao
      - DATABASE_USERNAME=postgres
  - name: db-config
    literals:
      - POSTGRES_DB=saudepublica_homologacao
      - POSTGRES_USER=postgres

patches:
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: homologacao.mais-saude.local
