apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mais-saude-homolog

resources:
  - ../../base
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-ingress.yaml

images:
  - name: ghcr.io/dufelizardo/mais_saude_publica
    newTag: 6af2f966710e45a92ccb1d61d2ba89be864bd851
  - name: ghcr.io/dufelizardo/mais_saude_publica-frontend
    newTag: 6af2f966710e45a92ccb1d61d2ba89be864bd851

configMapGenerator:
  - name: app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx384m
      - DATABASE_URL=jdbc:postgresql://postgres:5432/saudepublica_homologacao
      - DATABASE_USERNAME=postgres
  - name: db-config
    literals:
      - POSTGRES_DB=saudepublica_homologacao
      - POSTGRES_USER=postgres

patches:
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: homologacao.mais-saude.local
