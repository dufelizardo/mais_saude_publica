name: Publicar imagem (ghcr.io)

# Builda e publica a imagem em ghcr.io a cada push nas 4 branches do fluxo de promocao, tagueada
# com o nome da branch - o ArgoCD (rodando no home-lab, ver ADR-0012) puxa essa tag pro ambiente
# correspondente. So dispara em push (merge ja acontecido), nunca em pull_request - mesma logica
# do deploy-prod.yml, pra nao publicar imagem de um PR ainda nao promovido.
on:
  push:
    branches:
      - developer
      - qaa
      - homologacao
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dufelizardo/mais_saude_publica:${{ github.ref_name }}
            ghcr.io/dufelizardo/mais_saude_publica:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # :developer/:qaa/:homologacao/:main sao mutaveis - o syncPolicy do ArgoCD so reage ao texto do
  # manifest mudando de verdade no Git, nao a um digest novo atras de uma tag que nao mudou (ver
  # ADR-0012, pendencia da "tag movel" - mesma lacuna ja resolvida no projeto irmao LoneWolf,
  # ADR-0001/0003 de la). Pinar o overlay Kustomize do ambiente correspondente na tag imutavel
  # :<sha> deste build, e commitar isso de volta na mesma branch, e o que faz o ArgoCD enxergar um
  # diff real e sincronizar sozinho - sem SSH nem restart manual.
  pin-manifests:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Push direto na branch (nao PR) - developer/qaa/homologacao/main exigem PR por padrao
          # (Ruleset "Aprovacao obrigatoria para terceiros", ver ADR-0011), entao o commit de pin
          # so passa com um ator que tenha bypass de admin nessa Ruleset - o mesmo AUTOMERGE_PAT ja
          # usado pelo auto-merge.yml pra mergear com --admin.
          token: ${{ secrets.AUTOMERGE_PAT }}

      - name: Determinar overlay do ambiente
        id: overlay
        run: |
          case "${{ github.ref_name }}" in
            developer) echo "dir=k8s/overlays/dev" >> "$GITHUB_OUTPUT" ;;
            qaa) echo "dir=k8s/overlays/qaa" >> "$GITHUB_OUTPUT" ;;
            homologacao) echo "dir=k8s/overlays/homologacao" >> "$GITHUB_OUTPUT" ;;
            main) echo "dir=k8s/overlays/prod" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Pinar o overlay na tag deste build
        run: |
          sed -i "s#newTag: .*#newTag: ${{ github.sha }}#" "${{ steps.overlay.outputs.dir }}/kustomization.yaml"

      - name: Commitar e publicar se a tag pinada mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.overlay.outputs.dir }}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "Overlay já pinado nesta imagem"
          else
            # [skip ci] e essencial aqui: como o push usa um PAT (nao o GITHUB_TOKEN padrao), ele
            # conta como push "de verdade" e disparia este mesmo workflow de novo - sem o
            # [skip ci], viraria um loop infinito de rebuild+pin+rebuild.
            git commit -m "chore: pin ${{ github.ref_name }} a ${{ github.sha }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
