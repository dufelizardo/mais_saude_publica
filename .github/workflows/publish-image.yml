name: Publicar imagem (ghcr.io)

# Builda e publica a imagem em ghcr.io a cada push nas 4 branches do fluxo de promocao, tagueada
# com o nome da branch - o ArgoCD (rodando no home-lab, ver ADR-0012) puxa essa tag pro ambiente
# correspondente. So dispara em push (merge ja acontecido), nunca em pull_request - mesma logica
# do deploy-prod.yml, pra nao publicar imagem de um PR ainda nao promovido.
on:
  push:
    branches:
      - developer
      - qaa
      - homologacao
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dufelizardo/mais_saude_publica:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
