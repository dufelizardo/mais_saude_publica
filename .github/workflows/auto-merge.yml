name: Auto-merge de promoção

# Automatiza o unico passo manual que sobrava depois de abrir a PR de promocao
# (developer -> qaa -> homologacao -> main). So dispara nas 3 promocoes reais do fluxo - nao mexe
# em PRs abertas de/para qualquer outra branch (ex: um terceiro contribuindo direto em developer).
#
# Usa "gh pr merge --admin" em vez de "--auto": desde que a Ruleset de aprovacao obrigatoria pra
# terceiros existe (ADR-0011), o merge automatico (--auto) fica preso em "aguardando aprovacao"
# mesmo pro dono do repositorio, porque a fila de auto-merge nao aplica bypass de Ruleset sozinha
# - so um merge explicito com privilegio de admin aplica. Por isso o job espera os checks
# obrigatorios terminarem (nada e pulado) e so entao tenta o merge administrativo, que bypassa
# apenas a exigencia de aprovacao (bypassable), nunca os checks em si (enforce_admins: true na
# protecao classica nao tem bypass nenhum, nem pra admin).
#
# Usa o secret AUTOMERGE_PAT (Personal Access Token do dono do repositorio) em vez do
# github.token padrao: o bypass do Ruleset so reconhece a conta pessoal do dono, nao o bot
# github-actions[bot] por tras do github.token - com o token padrao, o "--admin" falha com
# "At least 1 approving review is required" mesmo depois dos checks passarem. Efeito colateral
# bom: um merge feito com o PAT tambem conta como push "de verdade" pro GitHub, entao
# deploy-prod.yml volta a disparar sozinho (antes precisava de workflow_dispatch manual).
#
# O PAT (fine-grained, escopo so deste repo) precisa da permissao "Administration: Read and
# write" alem de "Contents" e "Pull requests" - sem ela, "gh pr merge --admin" falha com
# "Resource not accessible by personal access token", porque baipassar uma regra do Ruleset e
# uma acao administrativa de verdade, nao coberta por "Pull requests: write" sozinho.
on:
  pull_request:
    types: [opened, reopened]
    branches:
      - qaa
      - homologacao
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  admin-merge:
    if: |
      (github.base_ref == 'qaa' && github.head_ref == 'developer') ||
      (github.base_ref == 'homologacao' && github.head_ref == 'qaa') ||
      (github.base_ref == 'main' && github.head_ref == 'homologacao')
    runs-on: ubuntu-latest
    steps:
      - name: Esperar os checks obrigatórios e mergear com privilégio de admin
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          # Checks exigidos pela protecao classica de qaa/homologacao/main (branches/{b}/protection).
          # Usa /commits/{sha}/check-runs (REST) em vez de "gh pr view --json statusCheckRollup":
          # o rollup da PR pode ficar momentaneamente vazio/desatualizado logo apos um evento
          # "synchronize" (ex: o commit de pin-manifests da ADR-0015 chegando via push enquanto a
          # PR de promocao acabou de abrir) - nessa janela, "0 pendentes" significa "os checks do
          # commit certo ainda nem foram criados", nao "ja passaram". Consultar os check-runs do
          # SHA atual, resolvido a cada iteracao, elimina essa corrida: so conta como "tudo pronto"
          # quando os 3 checks nomeados existem de fato para o commit que sera mergeado.
          required_checks="test analyze robot-acceptance"
          for i in $(seq 1 90); do
            sha=$(gh pr view "$pr" --json headRefOid --jq '.headRefOid')
            runs=$(gh api "repos/${GH_REPO}/commits/${sha}/check-runs" --jq '.check_runs')

            missing=0
            for check in $required_checks; do
              found=$(echo "$runs" | jq --arg c "$check" '[.[] | select(.name == $c)] | length')
              if [ "$found" -eq 0 ]; then
                missing=1
              fi
            done

            failed=$(echo "$runs" | jq '[.[] | select(.name != "admin-merge" and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out" or .conclusion=="action_required"))] | length')
            if [ "$failed" -gt 0 ]; then
              echo "Um check obrigatório falhou - não vou mergear."
              exit 1
            fi

            pending=$(echo "$runs" | jq '[.[] | select(.name != "admin-merge" and (.conclusion==null or .conclusion==""))] | length')
            if [ "$missing" -eq 0 ] && [ "$pending" -eq 0 ]; then
              echo "Todos os checks obrigatórios (${required_checks}) concluídos para ${sha} - mergeando com privilégio de admin."
              gh pr merge "$pr" --merge --admin
              exit 0
            fi
            echo "Tentativa $i: sha=${sha} missing=${missing} pending=${pending} - ainda esperando..."
            sleep 20
          done
          echo "Checks não terminaram a tempo (30 min)."
          exit 1
