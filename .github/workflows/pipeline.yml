name: Pipeline de Promoção

# Um workflow só, com 3 estágios em sequência (test -> analyze -> robot-acceptance, cada um
# depende do anterior via needs) - a aba Actions mostra isso como um grafo em linha, e um estágio
# só começa se o(s) anterior(es) passaram. Os 3 são obrigatórios na proteção de branch (nenhum é
# decorativo): se o JUnit falha, nem o CodeQL nem o Robot Framework chegam a rodar; se o CodeQL
# achar algo, o estágio caro do Robot Framework (build Docker + containers) nem começa.
#
# "test" e "analyze" rodam em todo push na developer e em todo PR de promoção
# (developer -> qaa -> homologacao -> main). "robot-acceptance" só roda nos PRs que promovem de
# fato (para qaa, homologacao ou main) - builda a imagem Docker real do projeto, sobe ela junto de
# um Postgres num container efêmero (só dura o job) e roda a suíte de aceitação contra a aplicação
# de pé. Nada fica "no ar" depois do job.
#
# "robot-ui" (ADR-0077) roda os testes de interface em todo PR, depois do "test": API pelo jar e
# frontend pelo ng serve, sem Docker, e so os testes com a tag UI.
#
# Há também um CodeQL.yml à parte, com uma varredura semanal (schedule) do repo inteiro - esse não
# é gate de promoção, é uma checagem periódica independente de PR.
on:
  push:
    branches:
      - developer
  pull_request:
    branches:
      - developer
      - qaa
      - homologacao
      - main

# Cancela um run anterior do mesmo PR/branch quando chega um commit novo - nao faz sentido gastar
# ~3min validando um commit que ja foi substituido. O commit final antes do merge sempre roda
# completo; so os intermediarios/superados sao cancelados cedo.
concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saudepublica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B clean compile

      - name: Run tests
        run: ./mvnw -B test

  analyze:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build with Maven
        run: ./mvnw -B clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  robot-ui:
    # Testes de interface em Robot Framework (ADR-0077), num Chromium headless, em duas fases:
    #   1. tag UI sem SEGURANCA: API do jar (perfil test, login desligado) na 8080 e front no ng serve
    #      (4200, proxy de /api para a 8080);
    #   2. tag SEGURANCA: uma segunda API na 8083, com login, autorizacao e prontuario por vinculo
    #      ligados e o administrador inicial (bootstrap), num banco proprio; o front volta a subir com
    #      proxy para a 8083.
    # Roda em todo PR - inclusive para developer -, para o seletor errado aparecer no PR da tela, e
    # nao so na promocao.
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saudepublica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Caixa de e-mail de teste da recuperação de senha (ADR-0081): SMTP na 1025, API HTTP na 8025.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Empacotar a API
        run: ./mvnw -B -DskipTests package

      - name: Subir as duas APIs
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create database saudepublica_seguranca"
          nohup java -jar target/mais_saude_publica-*.jar --spring.profiles.active=test --server.port=8080 > api.log 2>&1 &
          nohup java -jar target/mais_saude_publica-*.jar --spring.profiles.active=test --server.port=8083 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/saudepublica_seguranca \
            --app.security.enabled=true --app.security.authorization.enabled=true \
            --app.security.prontuario-por-vinculo.enabled=true \
            --app.security.bootstrap.cpf=52998224725 --app.security.bootstrap.senha='Robot#Admin123' \
            --spring.mail.host=localhost --spring.mail.port=1025 \
            --app.security.recuperacao-senha.url-frontend=http://localhost:4200 \
            > api-seguranca.log 2>&1 &

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Subir o frontend
        working-directory: frontend
        run: |
          npm ci
          nohup npx ng serve --port 4200 > ../front.log 2>&1 &

      - name: Esperar API e frontend responderem
        run: |
          for i in $(seq 1 90); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v3/api-docs || echo 000)
            seg=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8083/v3/api-docs || echo 000)
            front=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/ || echo 000)
            echo "Tentativa $i: API $api, API com seguranca $seg, front $front"
            if [ "$api" = "200" ] && [ "$seg" = "200" ] && [ "$front" = "200" ]; then exit 0; fi
            sleep 3
          done
          echo "--- api.log ---"; tail -n 80 api.log || true
          echo "--- api-seguranca.log ---"; tail -n 80 api-seguranca.log || true
          echo "--- front.log ---"; tail -n 80 front.log || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Robot Framework e o Chromium
        run: |
          pip install -r test/robot/requirements.txt
          rfbrowser init --with-deps chromium

      - name: Rodar testes de interface (login desligado)
        env:
          MSP_HOST_URL: http://localhost:8080
          MSP_FRONT_URL: http://localhost:4200
        run: robot --outputdir test/robot/results-ui --include UI --exclude SEGURANCA test/robot/test

      - name: Apontar o frontend para a API com seguranca
        if: always()
        working-directory: frontend
        run: |
          pkill -f "ng serve" || true
          printf '{"/api": {"target": "http://localhost:8083", "secure": false, "changeOrigin": true}}' > proxy-seguranca.json
          nohup npx ng serve --port 4200 --proxy-config proxy-seguranca.json > ../front-seguranca.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/ || echo 000)
            status=$(curl -s http://localhost:4200/api/v1/auth/status || true)
            echo "Tentativa $i: front $code, $status"
            if [ "$code" = "200" ] && echo "$status" | grep -q '"securityEnabled":true'; then exit 0; fi
            sleep 3
          done
          tail -n 80 ../front-seguranca.log || true
          exit 1

      - name: Rodar testes de interface (login, autorizacao e vinculo ligados)
        if: always()
        env:
          MSP_HOST_URL: http://localhost:8083
          MSP_FRONT_URL: http://localhost:4200
          MSP_ADMIN_CPF: '52998224725'
          MSP_ADMIN_SENHA: 'Robot#Admin123'
          MSP_MAILPIT_URL: http://localhost:8025
        run: robot --outputdir test/robot/results-ui-seguranca --include SEGURANCA test/robot/test

      - name: Publicar resultados da interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-ui-results
          path: |
            test/robot/results-ui/
            test/robot/results-ui-seguranca/
            api.log
            api-seguranca.log
            front.log
            front-seguranca.log

  robot-acceptance:
    needs: analyze
    if: github.event_name == 'pull_request' && contains(fromJson('["qaa","homologacao","main"]'), github.base_ref)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem da aplicação
        # Cache de camadas (imagens base) e do ~/.m2 baixado dentro do Dockerfile, persistido no
        # cache do GitHub Actions entre execuções - nao pula nenhum passo do build/teste, so evita
        # rebaixar as mesmas dependencias quando elas nao mudaram.
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: msp-app:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Criar rede Docker efêmera
        run: docker network create msp-ci-net

      - name: Subir PostgreSQL efêmero
        run: |
          docker run -d --name msp-postgres --network msp-ci-net \
            -e POSTGRES_DB=saudepublica_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            postgres:16

      - name: Esperar PostgreSQL ficar pronto
        run: |
          for i in $(seq 1 30); do
            docker exec msp-postgres pg_isready -U postgres && break
            sleep 2
          done

      - name: Subir a aplicação (container efêmero)
        run: |
          docker run -d --name msp-app --network msp-ci-net -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=test \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://msp-postgres:5432/saudepublica_test \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            msp-app:ci

      - name: Esperar a aplicação responder
        # Usa /v3/api-docs (springdoc) como probe, nao um endpoint de negocio: GET /api/v1/federal/
        # retorna 404 de proposito quando a lista esta vazia (banco recem-criado, sem seed), entao
        # nao serve como sinal de "app no ar".
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v3/api-docs || echo "000")
            echo "Tentativa $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Aplicação no ar (HTTP $code)."
              exit 0
            fi
            sleep 3
          done
          echo "Aplicação não respondeu a tempo. Corpo da última resposta:"
          curl -sS -i http://localhost:8080/v3/api-docs || true
          echo "--- Logs do container ---"
          docker logs msp-app
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências do Robot Framework
        run: pip install -r test/robot/requirements.txt

      - name: Rodar suíte de aceitação
        env:
          MSP_HOST_URL: http://localhost:8080
        # Os testes de interface (tag UI) rodam no job robot-ui.
        run: test/robot/run_tests.sh --exclude UI

      - name: Publicar resultados do Robot Framework
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: test/robot/results/

      - name: Derrubar containers e rede
        if: always()
        run: |
          docker rm -f msp-app msp-postgres || true
          docker network rm msp-ci-net || true
