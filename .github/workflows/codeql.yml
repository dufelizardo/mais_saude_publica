name: CodeQL

# Analise estatica de seguranca (SAST) no codigo Java. Roda a parte da pipeline.yml - nao gate de
# promocao entre branches, e sim varredura continua de vulnerabilidades (SQL injection, etc).
# Achados aparecem na aba Security > Code scanning do repositorio.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - developer
      - qa
      - cert
      - main
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build with Maven
        run: ./mvnw -B clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
