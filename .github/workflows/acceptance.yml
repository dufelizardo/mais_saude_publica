name: CI - Suíte de Aceitação (Robot Framework)

# Gate de promoção: só roda nos PRs que promovem código de um ambiente para o próximo
# (developer -> qa, qa -> cert, cert -> main). Builda a imagem Docker real do projeto, sobe ela
# junto de um Postgres num container efêmero (só dura o job) e roda a suíte Robot Framework de
# aceitação contra a aplicação de pé - depois derruba tudo. Não fica nada "no ar" após o job.
on:
  pull_request:
    branches:
      - qa
      - cert
      - main

jobs:
  robot-acceptance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build da imagem da aplicação
        run: docker build -t msp-app:ci .

      - name: Criar rede Docker efêmera
        run: docker network create msp-ci-net

      - name: Subir PostgreSQL efêmero
        run: |
          docker run -d --name msp-postgres --network msp-ci-net \
            -e POSTGRES_DB=saudepublica_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            postgres:16

      - name: Esperar PostgreSQL ficar pronto
        run: |
          for i in $(seq 1 30); do
            docker exec msp-postgres pg_isready -U postgres && break
            sleep 2
          done

      - name: Subir a aplicação (container efêmero)
        run: |
          docker run -d --name msp-app --network msp-ci-net -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=test \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://msp-postgres:5432/saudepublica_test \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            msp-app:ci

      - name: Esperar a aplicação responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/federal/)
            echo "Tentativa $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Aplicação no ar (HTTP $code)."
              exit 0
            fi
            sleep 3
          done
          echo "Aplicação não respondeu a tempo. Corpo da última resposta:"
          curl -sS -i http://localhost:8080/api/v1/federal/ || true
          echo "--- Logs do container ---"
          docker logs msp-app
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências do Robot Framework
        run: pip install -r test/robot/requirements.txt

      - name: Rodar suíte de aceitação
        env:
          MSP_HOST_URL: http://localhost:8080
        run: test/robot/run_tests.sh

      - name: Publicar resultados do Robot Framework
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: test/robot/results/

      - name: Derrubar containers e rede
        if: always()
        run: |
          docker rm -f msp-app msp-postgres || true
          docker network rm msp-ci-net || true
