name: CI - Build e Testes (JUnit)

# Gate rápido: roda em todo push na developer e em todo PR de promoção
# (developer -> qa -> cert -> main). Não builda imagem Docker nem roda Robot Framework -
# isso fica a cargo do acceptance.yml, só nos PRs de promoção.
on:
  push:
    branches:
      - developer
  pull_request:
    branches:
      - developer
      - qa
      - cert
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saudepublica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B clean compile

      - name: Run tests
        run: ./mvnw -B test
