# POSTGRESQL — precisa do banco "saudepublica" ja criado localmente (Postgres nao cria banco
# on-connect como o MySQL fazia).
spring.datasource.url=jdbc:postgresql://localhost:5432/saudepublica
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
# Dialect nao e declarado explicitamente aqui: o Hibernate autodetecta a partir do driver/URL da
# conexao. Todos os perfis (dev/test/prod) usam Postgres agora, entao nao ha mais risco de
# conflito entre perfis (ver AQUAQE-217, resolvido).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true