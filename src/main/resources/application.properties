# POSTGRESQL — precisa do banco "saudepublica" ja criado localmente (Postgres nao cria banco
# on-connect como o MySQL fazia).
spring.datasource.url=jdbc:postgresql://localhost:5432/saudepublica
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
# Dialect nao e declarado explicitamente aqui: o Hibernate autodetecta a partir do driver/URL da
# conexao. Todos os perfis (dev/test/prod) usam Postgres agora, entao nao ha mais risco de
# conflito entre perfis (ver AQUAQE-217, resolvido).
# O esquema e das migracoes do Flyway (ADR-0090, src/main/resources/db/migration); o Hibernate nao
# altera o banco. O perfil test valida as entidades contra o esquema migrado.
spring.jpa.hibernate.ddl-auto=none
# Banco que ja existia antes do Flyway (criado pelo ddl-auto) e marcado na V1 (esquema da v1.4.0) sem
# rodar nada; dali em diante recebe so as migracoes novas. Banco vazio roda tudo desde a V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true

# Toggle de seguranca (ver ADR-0055) — desligado por padrao (local). Ambientes implantados ligam
# via APP_SECURITY_ENABLED no configMap do respectivo overlay k8s, quando estiverem prontos.
app.security.enabled=false
# Exigir permissão por papel e escopo (ADR-0067). Só age com app.security.enabled=true.
app.security.authorization.enabled=false
# Prontuário por vínculo assistencial (ADR-0076). Só age com a autorização ligada.
app.security.prontuario-por-vinculo.enabled=false
app.security.prontuario-por-vinculo.janela-dias=30
app.security.prontuario-por-vinculo.acesso-justificado-horas=4
app.security.prontuario-por-vinculo.justificativa-minimo=20
# Recuperação de senha por e-mail (ADR-0081). Fica disponível com o login ligado, o SMTP configurado
# (spring.mail.host/port/username/password, ou SPRING_MAIL_* no ambiente) e o endereço do frontend
# para montar o link. Sem isso, a tela de login não oferece "Esqueci minha senha".
app.security.recuperacao-senha.url-frontend=
app.email.remetente=nao-responda@mais-saude.local
# Retenção da trilha de auditoria (ADR-0082): eventos mais antigos que o prazo são apagados por uma rotina
# diária (03:30, horário de Brasília). 20 anos = guarda do prontuário (Lei 13.787/2018). 0 = guarda indefinida.
app.auditoria.retencao-anos=20
# Sem valor: JwtService gera uma chave efemera em memoria na subida (ver JwtService) — nunca
# commitar um segredo real aqui. Ambientes reais recebem o valor de verdade via variavel de
# ambiente/Secret do k8s.
app.security.jwt-secret=
app.security.jwt-expiration-hours=8
app.security.jwt-expiration-hours-remember-me=168
# Bootstrap do AdministradorPlataforma (ADR-0054 decisao 5) — vazio por padrao, so cria o usuario
# inicial se ambas as variaveis forem explicitamente configuradas (ver AdministradorPlataformaBootstrap).
app.security.bootstrap.cpf=
app.security.bootstrap.senha=