#MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/saudepublica?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate
# Dialect nao e mais declarado explicitamente aqui: o Hibernate autodetecta a partir do
# driver/URL da conexao, e declarar aqui conflitava com o dialect proprio do perfil prod
# (application-prod.properties usa Postgres) — ver AQUAQE-217.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true