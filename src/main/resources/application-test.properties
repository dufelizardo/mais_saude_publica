# POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5432/saudepublica_test
# Testes e CI conferem que as entidades batem com o esquema das migracoes (ADR-0090): coluna ou tabela
# esquecida numa migracao derruba a subida aqui, nao em producao.
spring.jpa.hibernate.ddl-auto=validate
# Alertas da auditoria (ADR-0096): a rotina periodica fica desligada nos testes; eles chamam a deteccao direto.
app.auditoria.alertas.cron=-
