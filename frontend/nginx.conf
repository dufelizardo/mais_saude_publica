server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy pro backend dentro do mesmo namespace - evita CORS (front e API ficam em hosts
    # .local diferentes) sem precisar mexer em configuracao de CORS no Spring Boot. "app" resolve
    # via DNS do Kubernetes pro Service do backend no mesmo namespace deste overlay.
    location /api/ {
        proxy_pass http://app/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
