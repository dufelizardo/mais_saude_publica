<div class="modal-overlay" (click)="onOverlayClick()">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" (click)="onPanelClick($event)">
    <div class="modal-panel__head">
      <h2 id="modal-titulo">{{ titulo }}</h2>
      <button type="button" class="modal-panel__close" aria-label="Fechar" (click)="fechar.emit()">×</button>
    </div>
    <div class="modal-panel__body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
